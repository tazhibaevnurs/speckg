services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speckg
      POSTGRES_USER: speckg
      POSTGRES_PASSWORD: speckg
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speckg -d speckg"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://speckg:speckg@db:5432/speckg
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

volumes:
  postgres-data:
  media:
